name: Materialize PHP Lab

on:
  push:
    branches:
      - publish-v1.4.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify exact PHP release
        shell: bash
        run: |
          set -euo pipefail
          cat .staging/php-lab.zip.b64/*.part .staging2/php-lab.zip.b64/*.part > /tmp/php-lab.b64
          base64 -d /tmp/php-lab.b64 > /tmp/php-lab.zip
          echo "f2a6052c95304eeba195884c04cd6cf823944110e591a90ca1bb1b4d0b3b8afe  /tmp/php-lab.zip" | sha256sum -c -
          rm -rf php-lab /tmp/odlab-unpack
          mkdir -p /tmp/odlab-unpack
          unzip -q /tmp/php-lab.zip -d /tmp/odlab-unpack
          mv /tmp/odlab-unpack/ODLab_PHP_Namecheap_v1.4.0 php-lab
          rm -rf .staging .staging2 TEST_TOOL.txt

      - name: Commit materialized source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "release: publish OD Lab PHP/MySQL v1.4.0 source"
          git push
